<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Card Wars</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>

    <main class="login">
        <video
        class="login__background"
        autoplay
        muted
        loop
        playsinline
        >
        <source
            src="../assets/src/dulce reino.mp4"
            type="video/mp4"
        >
        </video>
        <section class="login__container">

            <header class="login__header">
                <h1>Card Wars</h1>
                <p>Prepárate para la batalla</p>
            </header>

            <form id="login-form">

                <div class="login__field">
                    <label for="nombre">¿Cómo te llamas?</label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Escribe tu nombre"
                        required
                    >
                </div>

                <div class="login__avatars">

                    <h2>Elige tu avatar</h2>

                    <div class="avatars">

                        <button
                            type="button"
                            class="avatar"
                            data-avatar="finn"
                        >
                            <img src="../assets/src/finn.webp" alt="Finn">
                            <span>Finn</span>
                        </button>

                        <button
                            type="button"  
                            class="avatar"
                            data-avatar="jake"
                        >
                            <img src="../assets/src/jake.webp" alt="Jake">
                            <span>Jake</span>
                        </button>

                        <button
                            type="button"
                            class="avatar"
                            data-avatar="marceline"
                        >
                            <img src="../assets/src/marceline.webp" alt="Marceline">
                            <span>Marceline</span>
                        </button>

                        <button
                            type="button"
                            class="avatar"
                            data-avatar="princesa-chicle"
                        >
                            <img
                                src="../assets/src/dulce.webp"
                                alt="Princesa Chicle"
                            >
                            <span>Princesa Chicle</span>
                        </button>

                        <button
                            type="button"
                            class="avatar"
                            data-avatar="rey-helado"
                        >
                            <img
                                src="../assets/src/rey helado.webp"
                                alt="Rey Helado"
                            >
                            <span>Rey Helado</span>
                        </button>

                        <button
                            type="button"
                            class="avatar"
                            data-avatar="flama"
                        >
                            <img
                                src="../assets/src/princesa flama.webp"
                                alt="Flama"
                            >
                            <span>Flama</span>
                        </button>

                        <button
                            type="button"
                            class="avatar"
                            data-avatar="mentita"
                        >
                            <img
                                src="../assets/src/mentita.webp"
                                alt="Mentita"
                            >
                            <span>Mentita</span>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login__button">
                    Jugar
                </button>

            </form>

        </section>

    </main>

    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/login.js"></script>


</body>
</html>
