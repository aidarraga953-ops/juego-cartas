<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Card Wars | Batalla</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/batalla.css"
    >

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <a
            href="./inicio.html"
            class="navbar__logo"
        >
            Card Wars
        </a>


        <div class="navbar__links">

            <a href="./inicio.html">
                Inicio
            </a>

            <a href="./seleccion.html">
                Selección
            </a>

            <a href="./batalla.html">
                Batalla
            </a>

        </div>

    </nav>



    <!-- BATALLA -->

    <main class="battle">


        <!-- CABECERA -->

        <header class="battle__header">

            <h1>
                Batalla
            </h1>

            <p id="battle-map">
                Mapa
            </p>

        </header>



        <!-- TABLERO -->

        <section class="battle__board">


            <!-- JUGADOR -->

            <div class="battle__side battle__side--player">

                <h2>
                    Tu carta
                </h2>


                <div
                    id="active-player-card"
                    class="battle__active-card"
                ></div>

            </div>



            <!-- VS -->

            <div class="battle__vs">

                <span>
                    VS
                </span>

            </div>



            <!-- ENEMIGO -->

            <div class="battle__side battle__side--enemy">

                <h2>
                    Enemigo
                </h2>


                <div
                    id="active-enemy-card"
                    class="battle__active-card"
                ></div>

            </div>


        </section>



        <!-- CARTAS DEL JUGADOR -->

        <section class="battle__team">

            <h2>
                Tus cartas
            </h2>


            <div
                id="player-cards"
                class="battle__cards"
            ></div>

        </section>


    </main>



    <!-- JAVASCRIPT -->

    <script
        type="module"
        src="../js/batalla.js"
    ></script>


</body>

</html>
